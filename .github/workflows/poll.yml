name: Poll RSS feeds

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Не запускати нове опитування, поки попереднє ще працює
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run poller
        run: node scripts/poller.mjs
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_KEY: ${{ secrets.API_KEY }}
